name: Finance repair isolation
on:
  push:
    branches: [fix/recurring-and-confirmed-defects-20261014]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: finance-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install patched dependency candidate without lifecycle scripts
        run: npm install --ignore-scripts --no-fund --no-audit --save-exact next@16.3.6 eslint-config-next@16.3.6
      - name: Emit dependency delta for offline readback
        run: |
          node -e 'const fs=require("node:fs"),cp=require("node:child_process");const old=JSON.parse(cp.execFileSync("git",["show","HEAD:package-lock.json"]));const next=JSON.parse(fs.readFileSync("package-lock.json"));const changed=Object.fromEntries(Object.entries(next.packages).filter(([k,v])=>JSON.stringify(v)!==JSON.stringify(old.packages[k])));const removed=Object.keys(old.packages).filter(k=>!(k in next.packages));console.log("FINANCE_DEPENDENCY_DELTA="+JSON.stringify({packageJson:JSON.parse(fs.readFileSync("package.json")),changed,removed}));'
      - name: Save reviewed dependency candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finance-patched-dependency-candidate
          path: |
            package.json
            package-lock.json
          retention-days: 7
      - run: npm test
      - run: npx tsc --noEmit --incremental false
      - run: npm run lint
      - name: Install isolated browser runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-flow.cjs
      - run: npm run build -- --webpack
